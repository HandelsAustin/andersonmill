<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Count & Run — Handel's Homemade Ice Cream app icon -->
  <!-- Brand colors: blue #2c3691 (background), red #d72627 (accent), white text -->

  <!-- Background -->
  <rect width="192" height="192" rx="28" fill="#2c3691"/>

  <!-- Red accent stripe -->
  <rect x="0" y="148" width="192" height="44" rx="0" fill="#d72627"/>
  <rect x="0" y="148" width="192" height="44" rx="0" fill="#d72627"/>
  <!-- Clip bottom corners to match outer rx -->
  <rect x="0" y="164" width="192" height="28" rx="0" fill="#d72627"/>
  <rect x="0" y="148" width="192" height="16" fill="#d72627"/>
  <rect x="0" y="163" width="28" height="29" rx="0" fill="#2c3691"/>
  <rect x="164" y="163" width="28" height="29" rx="0" fill="#2c3691"/>
  <rect x="14" y="168" width="164" height="24" rx="8" fill="#d72627"/>

  <!-- C&R monogram -->
  <text
    x="96" y="128"
    font-family="Impact, 'Arial Black', 'Arial Bold', sans-serif"
    font-size="96"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="auto"
    letter-spacing="-2">C&amp;R</text>

  <!-- App label -->
  <text
    x="96" y="183"
    font-family="'Arial Narrow', Arial, sans-serif"
    font-size="15"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="3"
    opacity="0.92">COUNT &amp; RUN</text>
</svg>
